[workspace]
members = ["crates/dll", "crates/dlghook"]
exclude = ["crates/vendor/exr"]
# Build BOTH the core package (rlib + the two EXEs) AND the cdylib wrapper on a bare
# `cargo build` — so `cargo build --release` still produces sagethumbs2k.dll + the EXEs.
# CI + the integration tests rely on the DLL existing. `dlghook` is the third artifact
# (st2k_dlghook.dll): the Open/Save-dialog selection reader, which is a SEPARATE tiny
# cdylib because it gets loaded into other applications — see crates/dlghook/Cargo.toml.
default-members = [".", "crates/dll", "crates/dlghook"]
resolver = "2"

# exr 1.74.2 added DWAA/DWAB encode/decode support, but stores two lazily-filled
# 128 KiB lookup tables inline in OnceLock statics. MSVC consequently embeds both
# zero-filled tables in every Rust artifact (DLL + GUI + CLI), adding hundreds of
# KiB of duplicated raw payload. The exact installer effect is compression-dependent.
#
# Keep the new DWA support while moving only the table storage to loader-zeroed
# module memory, so it remains leak-free when Explorer unloads the shell extension.
# The vendored crate is the exact crates.io 1.74.2 source plus the documented patch
# in crates/vendor/exr/SAGETHUMBS-PATCH.md. Remove this override after upstream ships the fix.
[patch.crates-io]
exr = { path = "crates/vendor/exr" }
# JPEG XL, patched for 1:8 LF-only rendering (a 12 MP .jxl thumbnailed in ~2 s because a
# thumbnail cost a full-resolution decode; the LF image is a complete 8x-downsampled picture
# that the decoder already builds before any HF work). Submitted upstream as
# tirr-c/jxl-oxide#505 - DROP THIS AND THE crates/vendor COPIES once a release contains it.
#
# The copies here are GENERATED, not hand-edited. `scripts/vendor-jxl.ps1` re-extracts the
# pristine crates.io sources and re-applies crates/vendor/jxl-patches/*.patch, so bumping the
# version is: change the version in that script, run it, and it either succeeds or names the
# hunks that no longer apply. Do NOT edit crates/vendor/jxl-render or jxl-oxide by hand; the
# next run overwrites it and the change is lost with nothing to say so.
jxl-render = { path = "crates/vendor/jxl-render" }
jxl-oxide = { path = "crates/vendor/jxl-oxide" }

# Shared version for the rlib (`sagethumbs2k`) + the cdylib wrapper (`sagethumbs2k-dll`),
# build-release.ps1 reads this line; keep it in sync with
# scripts/packaging/AppxManifest.xml's <Identity Version> when bumping a release.
[workspace.package]
version = "2.3.0"
rust-version = "1.93"   # sevenz-rust2 0.21.4 is the highest MSRV in the locked default graph

[package]
name = "sagethumbs2k"
version.workspace = true
edition = "2021"
build = "src/build.rs"
license = "PolyForm-Noncommercial-1.0.0"
publish = false                     # a Windows shell-extension app — never goes to crates.io
description = "Modern Rust thumbnail + context-menu shell extension (SageThumbs 2K)"
repository = "https://github.com/LunarWerxs/SageThumbs-2k"
rust-version.workspace = true

# cargo-machete reads crate NAMES + source text, so it MISSES two real uses and flags
# them falsely: `kamadak-exif` is imported as `exif` (`exif::Reader` in src/decode.rs),
# and `windows-core` is referenced only inside the `#[implement]` macro's generated code.
# Ignore both so the unused-dep check stays green and surfaces only genuine findings.
[package.metadata.cargo-machete]
ignored = ["kamadak-exif", "windows-core"]

[lib]
# Renamed `sagethumbs2k` -> `sagethumbs2k_core`: the shipped DLL is now a SEPARATE
# `sagethumbs2k` cdylib crate (see `crates/dll/`) that wraps this rlib's COM entry points. No
# crate is both cdylib AND rlib anymore, which eliminates the intermittent cargo#6313
# link collision that broke CI. This crate is rlib-only — linked by the two bins and
# the integration tests; the bins/tests now `use sagethumbs2k_core`.
name = "sagethumbs2k_core"
crate-type = ["rlib"]

# The Options / convert-dialog host EXE. The target is `SageThumbs2K` so `cargo build`
# emits `SageThumbs2K.exe` DIRECTLY — the shipped/running name Task Manager shows, matching
# build.rs's VERSIONINFO OriginalFilename, `lib.rs::APP_EXE`, and AppxManifest.
#
# GOTCHA (handled): this basename case-folds to the same PDB as the `sagethumbs2k.dll`
# cdylib on Windows' case-insensitive FS, which historically broke combined debug/test
# builds with LNK1201 (two links contend for one PDB file). The fix lives in
# **crates/dll/build.rs**, which redirects the CDYLIB's PDB to `sagethumbs2k_dll.pdb` — NOT this
# bin's. (Redirecting the bin's PDB forces its normal + `--test` compilations onto one
# fixed path and reintroduces LNK1201 under `cargo test`; the cdylib is a single artifact
# with no `--test` twin, so redirecting it is safe.) Verified on `cargo build`, `cargo
# build --release`, and `cargo test`. Don't drop that redirect or rename this target.
[[bin]]
name = "SageThumbs2K"
path = "src/bin/app/main.rs"

# `st2k` — the command-line / AI-agent tool (console subsystem).
[[bin]]
name = "st2k"
path = "src/bin/cli.rs"

[dependencies]
# Default features off (they'd pull the heavy AVIF encoder rav1e); we enable just
# the codecs we use. AVIF/HEIC *decode* comes via WIC; exotic convert-to targets
# (PSD/DDS/JP2/…) are encoded through the bundled ImageMagick, not `image`.
image = { version = "0.25", default-features = false, features = [
    "png", "jpeg", "gif", "bmp", "ico", "tiff", "webp", "pnm", "tga", "dds", "hdr", "exr", "ff", "qoi",
] }
# DDS block decoding (BC1–BC7, including BC6H HDR). `image`'s own DDS decoder — and
# Windows' WIC DDS codec — stop at DXT1/3/5, and ImageMagick can't read BC4/BC5-signed/
# BC6H at all, so modern game textures needed this. MIT, `no_std`, ZERO dependencies,
# safe Rust, and fuzzed against the original C `bcdec` for identical output. The
# container half (headers, DXGI dispatch, bomb guards) is ours in `decode/dds.rs`.
bcdec_rs = "0.2"
# Direct access to the already-vendored EXR writer lets the Convert path stream
# f32 tiles from DynamicImage without allocating a second full-size RGBA32F frame.
# Keep Rayon off: the non-parallel writer has a fixed, bounded working set.
exr = { version = "=1.74.2", default-features = false }
# Color management: apply an embedded ICC profile to bring wide-gamut (Display-P3 /
# Adobe RGB) thumbnails into sRGB so they aren't over-saturated (and don't get cached
# wrong). NOT a new dependency — `image` (and `jxl-oxide`) ALREADY pull moxcms 0.8
# transitively, so naming it here shares the same compiled crate = zero added bytes.
# Pure-Rust, Apache-2.0 OR BSD-3 (no C, no GPL).
moxcms = "0.8"
# CMYK JPEGs: the `image` crate converts CMYK→RGB naively (ignoring the embedded CMYK ICC)
# → wrong/inverted colors. We decode the RAW 4-channel CMYK with zune-jpeg (the JPEG backend
# `image` ALREADY uses, so naming it here shares the compiled crate = zero added bytes) and
# color-manage CMYK→sRGB via moxcms above. Re-exports `zune_core` (ColorSpace/DecoderOptions).
zune-jpeg = "0.5"
kamadak-exif = "0.6"
# JSON for the `st2k --mcp` MCP server (JSON-RPC 2.0 over stdio). Pure-Rust,
# MIT OR Apache-2.0. Only reached from the CLI binary — LTO dead-strips it from
# the shell-extension DLL (which never touches the mcp module).
serde_json = "1"
# Quick preview: markdown -> block/inline events for the viewer's in-process GDI renderer
# (VIEWER / EXE-only). Pure-Rust, MIT, small — chosen over a WebView2 host to keep the binary
# lean + the render `--shot`-verifiable. Referenced ONLY from `src/bin/app/preview/**`, so LTO
# dead-strips it from the DLL. default-features off drops the `getopts` CLI bits.
pulldown-cmark = { version = "0.13", default-features = false }
# Lossless metadata strip (rewrite JPEG segments / PNG chunks, no pixel re-encode).
# Pure-Rust, MIT OR Apache-2.0. Adds `bytes` as the only new transitive crate.
img-parts = "0.4"
# Lossy WebP encode (image-webp only does lossless), via libwebp/cc — the ONLY C
# dependency in the build. OPTIONAL behind the `webp-lossy` feature (off by default)
# so the default build is pure-Rust and needs no C compiler. The release installer
# opts in (build-release.ps1); without it, a lossy-WebP request degrades to lossless
# WebP (via the `image` crate). MIT OR Apache-2.0.
webp = { version = "0.3", default-features = false, optional = true }
# Pure-Rust SVG rasterizer (MIT/Apache) — a format Windows can't thumbnail.
# default-features off: we render with `usvg::Options::default()` and never load a
# fontdb, so `text`/`system-fonts`/`memmap-fonts` are dead weight, and we don't need
# the `raster-images` (<image>-tag) decoder. Shapes/paths/gradients still render.
resvg = { version = "0.48", default-features = false }
windows-registry = "0.6"
# NOT unused despite what cargo-machete says: the `#[implement]` macro from
# windows-implement EXPANDS to code that references `windows_core::` paths, so the
# direct dep must stay or every COM coclass fails its IUnknownImpl bound.
windows-core = "0.62"
windows-implement = "0.60"
# WinRT async plumbing (IAsyncOperation/IAsyncAction/AsyncStatus) for the OS PDF
# renderer in pdf.rs. Same version `windows` 0.62 pulls in transitively.
windows-future = "0.3"
# WebView2 COM bindings for the Quick preview HTML host — OPTIONAL, gated behind the
# `html-preview` feature (EXE-only; see [features]). 0.39 uses the same `windows` 0.62
# the project already has (verified single-crate). Not bundled: the Edge engine ships
# with Win11; only WebView2Loader.dll (~150 KB) rides alongside the EXE.
webview2-com = { version = "0.39", optional = true }

# --- Ebook / comic-archive cover extraction (the DarkThumbs port) ---
# All pure-Rust, MIT/Apache. We only ever READ zip members, so we want inflate
# without the zopfli *encoder*. zip's umbrella `deflate` feature hardcodes both
# `deflate-zopfli` AND a zlib backend. Instead: `deflate-flate2` selects the flate2
# read path and activates zip's optional flate2 dependency, and the direct flate2 dep
# below supplies its pure-Rust `rust_backend` (miniz_oxide) via feature unification —
# C-free, and no zopfli.
#
# The companion `"flate2"` feature that used to sit here is GONE as of zip 8: the crate
# moved that optional dependency to `dep:` syntax, which removes the implicit feature of
# the same name, and naming it is now a hard resolver error rather than a no-op. It is
# also redundant, because `deflate-flate2 = ["_deflate-any", "dep:flate2"]` already turns
# the dependency on. Verified against zip 8.6.0's own manifest: neither `deflate-zopfli`
# nor any `deflate-flate2-zlib*` variant is reachable from what we ask for, so the
# C-free/no-zopfli property this comment exists to protect still holds.
zip = { version = "8", default-features = false, features = ["deflate-flate2"] }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
# Autodesk Fusion 360 `.f3d` stores its preview PNG as a zstd-compressed ZIP entry,
# which the `zip` crate can't inflate without the zstd C lib. `ruzstd` is a pure-Rust,
# decode-only zstd implementation (MIT OR Apache-2.0) — keeps the build C-free.
ruzstd = "0.9"
base64 = "0.23"
percent-encoding = "2"
# 7-Zip (cb7 + generic .7z) — pure-Rust. `default-features = false` is LOAD-BEARING:
# 0.21's default set pulls `bzip2` (C) and the LZMA *encoder*; with it off we get
# only the pure-Rust LZMA/LZMA2/BCJ/Delta DECODE path (`lzma-rust2` is a non-optional
# dep), keeping the build C-free (no bzip2/zstd/brotli/lz4). 0.21 (from 0.13) is the
# version that BOUNDS the header's declared entry count (`bounded_count`), so a crafted
# `.7z` can no longer abort us with a capacity-overflow allocation during header parse.
sevenz-rust2 = { version = "0.21", default-features = false }
# Audio cover-art reader (MP3/FLAC/Ogg/Opus/M4A/WMA/APE/WavPack/Musepack/…).
# Pure-Rust, MIT OR Apache-2.0. Used read-only — we only pull the picture block.
lofty = "0.25"
# RAR (cbr) cover decode — the PURE-RUST `rars` crate (MIT OR Apache-2.0, no C, no
# proprietary UnRAR, `#![forbid(unsafe_code)]`). Validated byte-identical to UnRAR on
# real RAR3/RAR5 + a real comic. Replaces the old optional `unrar` C++ dep (2026-06-15),
# so `.cbr` now works in the DEFAULT build and there's no longer a non-permissive piece
# anywhere. Reads from memory, so no `tempfile` spill is needed either.
#
# rars 0.6.0 made `rayon` a MANDATORY (non-optional) dependency of its own Cargo.toml,
# so there is no longer a `parallel` feature to turn off: rayon links into every crate
# that pulls `rars`, including the shell DLL (`cargo tree -p sagethumbs2k-dll -i rayon`
# confirms it). No pool is actually spun up today: `container/rar.rs::extract_n` calls
# the sequential `ArchiveReader::extract_to`, never `extract_to_parallel_buffered` (the
# only rars API that touches rayon); a guard test in rar.rs keeps it that way. The
# exposure is binary size plus a future call-site regression, not a live pool inside
# Explorer. Revisit (pin/patch) if upstream ships a release with `rayon` optional again.
rars = "0.6"
# DjVu (.djvu) cover decode — the maintained pure-Rust `djvu-rs` codec (MIT, C-free,
# fuzzed). Replaced our hand-rolled zp/iw44/jb2/djvu stack (2026-06-14): deletes ~2,400
# lines of our own arithmetic-coder/wavelet/bilevel code + gains full multipage support.
# `std` is REQUIRED: the render pipeline needs it at runtime (a no_std build compiles but
# silently decodes nothing). It necessarily brings decode-side `png 0.17` + `zune-jpeg`
# (the app's image stack uses `png 0.18`, so deny.toml documents that unavoidable duplicate).
# Historically `std` ALSO dragged in the writer stack — `zip`/`zopfli` + `jpeg-encoder`
# (PDF/TIFF/EPUB/image EXPORT we never call) — and because Cargo unifies features, its
# `zip[deflate]` even forced `zopfli` back into OUR
# deliberately-zopfli-free `zip` below. Fixed upstream in 0.26.0 (issue #509): `std` is now
# DECODE-ONLY; the writer deps live under `pdf`/`epub`/`cli`, which we don't enable. So the
# bump to 0.26 sheds `jpeg-encoder` + `zopfli` (+ its runtime `bumpalo`) from the DLL and
# restores our C-free/no-zopfli `zip`. Decode-only otherwise (no image/tiff/epub/jpeg
# export, no OCR/async/cli/parallel/serde/mmap).
djvu-rs = { version = "0.27", default-features = false, features = ["std"] }
# JPEG XL (.jxl) decode — the pure-Rust `jxl-oxide` crate (MIT OR Apache-2.0, C-free).
# jxl is an ADVERTISED format (formats.rs) but neither the `image` crate nor WIC decode
# it, and build-release.ps1 strips the jxl coder out of the bundled magick — so without
# this tier jxl silently fails to thumbnail on a clean install. The `image` feature
# yields a DynamicImage via the ImageDecoder trait (gray/RGB/alpha, 8/16-bit, float).
# `default-features = false` DROPS the `rayon` feature on purpose: rayon would land a
# global thread pool inside explorer.exe (the same reason parallel.rs hand-rolls its
# pool). The optional `lcms2` (a C ICC binding) stays off — thumbnails don't need CMS.
# NOTE: jxl-oxide is Rust edition 2024 and needs Rust 1.85; the workspace's effective
# MSRV is higher because of sevenz-rust2 (see `rust-version` above).
jxl-oxide = { version = "0.12", default-features = false, features = ["image"] }

# --- FLV Flash codecs: VP6 + Sorenson Spark (issue #26) ---
# Pure-Rust decoders for the two pre-H.264 FLV codecs, the exact crates Ruffle ships
# (they ARE the Flash codecs). Not on crates.io, so pinned by rev to Ruffle's repos.
# ALL FIVE ARE OPTIONAL behind the EXE-only `flash-video` feature (see [features]):
# both decoder stacks PANIC on malformed input (measured: 17 unwrap/panic sites in
# nihav's vp56.rs, 28 in h263's reader.rs), and this workspace builds panic=abort
# where catch_unwind cannot help — so they must NEVER link into the shell-extension
# DLL. They are referenced ONLY from `src/bin/` (the `st2k flv-frame` child verb);
# the core rlib spawns st2k.exe out of process instead (src/flv.rs), mirroring how
# webview2-com is kept EXE-only via `html-preview`. Acceptance check:
# `cargo tree -p sagethumbs2k-dll` must never list nihav or h263.
# Being git-pinned (no crates.io release) means no semver and a dependency on Ruffle's
# repos staying reachable, mitigated today by pinning a REV, never a branch (see
# deny.toml's `allow-git`). If repo availability ever becomes a concern, vendor under
# `crates/vendor/` with a `SAGETHUMBS-PATCH.md`, same as the `exr` precedent above.
# --- VP9 Profile 2/3 (10/12-bit HDR in webm/mkv, the last open codec of issue #26) ---
# Media Foundation cannot decode VP9 Profile 2 AT ALL — measured on this machine with the
# Store VP9 extension 1.2.20.0 installed AND an RTX 4070 Ti present: Profile 0 renders,
# Profile 2 returns "cannot decode" (the GPU vendor decoder is not reachable through
# IMFSourceReader). `vp9dec` is a pure-Rust VP9 decoder (MIT, ZERO dependencies) verified
# here against FFmpeg FATE conformance vectors (Profile 2 10/12-bit, Profile 3 10-bit
# 4:4:4 + 12-bit 4:2:2, Profile 1 4:4:0) and fuzzed with 20k keyframe mutations (0 panics).
# OPTIONAL behind the EXE-only `vp9-video` feature, same containment as `flash-video`
# above: it is 0.1.1 with 55 unsafe blocks (mostly SIMD) and this workspace builds
# panic="abort" where catch_unwind cannot help, so it runs ONLY in the throwaway
# `st2k vp9-frame` child process, never the shell DLL. Acceptance check:
# `cargo tree -p sagethumbs2k-dll` must never list vp9dec.
vp9dec = { version = "0.1.1", optional = true }

nihav_core = { git = "https://github.com/ruffle-rs/nihav-vp6", rev = "12d0bdf10a85641dc2de3d6900c747894431ed77", optional = true }
nihav_codec_support = { git = "https://github.com/ruffle-rs/nihav-vp6", rev = "12d0bdf10a85641dc2de3d6900c747894431ed77", optional = true }
nihav_duck = { git = "https://github.com/ruffle-rs/nihav-vp6", rev = "12d0bdf10a85641dc2de3d6900c747894431ed77", optional = true }
h263-rs = { git = "https://github.com/ruffle-rs/h263-rs", rev = "e4e8b8303a33900d0988eaa8739bef43970f867d", optional = true }
h263-rs-yuv = { git = "https://github.com/ruffle-rs/h263-rs", rev = "e4e8b8303a33900d0988eaa8739bef43970f867d", optional = true }

[features]

# HDR screenshots (Windows Graphics Capture + D3D11 + DXGI). APP-ONLY on purpose:
# these windows-rs namespaces add ~900 KB to every binary that links them, and the
# shell DLL neither takes screenshots nor should ever load a graphics stack inside
# Explorer. build-release builds the DLL and the app as separate packages, so with
# the feature off for the DLL build its `windows` dependency is compiled without
# them. Measured: enabling this for the DLL too blew the Rust payload budget by
# 681 KB for code that could never run there.
hdr-capture = [
    "windows/Win32_Graphics_Dxgi",
    "windows/Win32_Graphics_Dxgi_Common",
    "windows/Win32_Graphics_Direct3D",
    "windows/Win32_Graphics_Direct3D11",
    "windows/Win32_System_WinRT_Direct3D11",
    "windows/Win32_System_WinRT_Graphics_Capture",
    "windows/Graphics_Capture",
    "windows/Graphics_DirectX",
    "windows/Graphics_DirectX_Direct3D11",
]

# (`.cbr`/RAR is now always-on via the pure-Rust `rars` crate — no feature gate.)
# `flash-video` is DEFAULT-ON so a plain dev `cargo build`/`cargo test` exercises the FLV
# VP6/Sorenson path; the DLL stays clean because crates/dll depends on this package with
# `default-features = false` (its effective feature set was empty before this and is
# unchanged). See the `flash-video` entry below for why the DLL must never enable it.
default = ["flash-video", "vp9-video"]
# Quick preview's WebView2 HTML host (local .html render + optional .url live preview).
# EXE-ONLY, off by default: build-release.ps1 enables it for the `-p sagethumbs2k` (EXE)
# build; the separately-built slim DLL never requests it, so `webview2-com` never links
# into the shell-extension cdylib. `webview2-com` 0.39 tracks the same `windows` 0.62 the
# project already uses (single crate). The Evergreen runtime ships with Win11, so nothing
# heavy is bundled — just the ~150 KB WebView2Loader.dll alongside the EXE. Runtime is
# ALSO gated behind default-OFF Settings toggles (preview_html / preview_url_live).
html-preview = ["dep:webview2-com"]
# FLV VP6 / Sorenson Spark decode for the hidden `st2k flv-frame` child verb. EXE-ONLY,
# same containment as `html-preview`: the decoder crates are referenced ONLY from
# `src/bin/vdec/` (the st2k console binary), and the DLL package opts out via
# `default-features = false` on its core dependency, so the panicky decoder crates never
# link into the shell-extension cdylib (they abort the whole host process on malformed
# input under panic=abort — inside Explorer that would be fatal; acceptance check:
# `cargo tree -p sagethumbs2k-dll` lists no nihav/h263). The core rlib needs no cfg: it
# just spawns the sibling st2k.exe, and a build without this feature answers that spawn
# with a clean non-zero exit (no thumbnail, exactly the pre-#26 behaviour).
flash-video = [
    "dep:nihav_core",
    "dep:nihav_codec_support",
    "dep:nihav_duck",
    "dep:h263-rs",
    "dep:h263-rs-yuv",
]
# VP9 Profile 2/3 decode for the hidden `st2k vp9-frame` child verb. EXE-ONLY, the exact
# `flash-video` containment: `vp9dec` is referenced ONLY from `src/bin/vdec/` (the st2k
# console binary), and the DLL package opts out via `default-features = false` on its core
# dependency, so the unsafe-SIMD-heavy 0.1.x decoder never links into the shell-extension
# cdylib (under panic=abort a panic there would kill Explorer; acceptance check:
# `cargo tree -p sagethumbs2k-dll` lists no vp9dec). The core rlib needs no cfg: it just
# spawns the sibling st2k.exe, and a build without this feature answers that spawn with a
# clean non-zero exit (no thumbnail — exactly the pre-support behaviour for Profile 2/3).
vp9-video = ["dep:vp9dec"]
# Lossy WebP encode via libwebp (C). Off by default → pure-Rust build; the release
# installer enables it. Without it, lossy-WebP convert falls back to lossless WebP.
webp-lossy = ["dep:webp"]
# Builds the shell-extension DLL with ONLY the `menu_*` translation keys instead of
# the full 36-language LOCALES table, shrinking the cdylib by ~0.2–0.28 MB (it loads
# into Explorer and only looks up `menu_*` strings). The release pipeline enables it
# for a SECOND `cargo build --lib` that produces the slim DLL; the EXEs/CLI keep the
# full table. NEVER use on the default build — it would strip the app's dialog strings.
dll-i18n-subset = []

[dev-dependencies]
# Test-only 7z writer: build non-solid/duplicate-name archives in memory so the
# exact-index, aggregate-budget extraction path has end-to-end coverage. The
# shipped dependency above remains decode-only (`compress` is not in release).
sevenz-rust2 = { version = "0.21", default-features = false, features = ["compress"] }

[build-dependencies]
# Embeds the app manifest (Common-Controls v6 + DPI awareness) into the EXE so
# the Options dialog renders with the native Win11 control theme.
embed-manifest = "1.4"
# Build-time only: parse locales/*.toml into a static table. No runtime TOML
# parser ships in the DLL — translations are baked in as &'static str.
toml = "1"
# VERSIONINFO (FileVersion/ProductVersion = pkg version, ProductName "SageThumbs
# 2K") is embedded by build.rs's own windres pass — folded into the existing
# manifest+icon .rc for the EXEs, and a separate `rustc-link-arg-cdylib` object
# for the DLL. We deliberately do NOT pull `winresource`/`embed-resource`: under
# the pinned MSVC toolchain they need `vswhom` + `winreg 0.52` (to locate
# rc.exe), neither of which is in this machine's offline cargo cache, and they'd
# double-embed VERSIONINFO on the bins that already carry the windres object.
# windres is already a build requirement here (the file icon), with a graceful
# cargo:warning fallback if it's missing.

[dependencies.windows]
version = "0.62"
features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant", # PROPVARIANT + the IMFSourceReader seek methods (Get/SetCurrentPosition) for the video frame-grab offset

    "Win32_Networking_WinInet", # InternetOpenUrlW: HTTPS-only, size-capped fetch of the remote ad manifest + images
    "Win32_Security_Cryptography", # BCryptHash (SHA-256): verify the downloaded installer before the self-update runs it
    "Win32_System_LibraryLoader",
    "Win32_System_SystemInformation", # GetLocalTime for screenshot filenames
    "Win32_System_RemoteDesktop", # WTSRegisterSessionNotification: re-arm the screenshot hotkeys on session lock/unlock + RDP reconnect (they get silently dropped otherwise)
    "Win32_System_Threading", # CreateMutexW: TOCTOU-safe single-instance guards (FindWindow alone races at logon/double-click)
    "Win32_System_JobObjects", # the `st2k flv-frame` child caps its OWN memory before reading stdin: a subprocess contains a crash, not an 8 GB allocation from a crafted Sorenson header
    "Win32_Security", # GetTokenInformation(TokenElevation): the install-time heal must NOT spawn the hotkey daemon elevated (UIPI would deafen it to Settings)
    "Win32_System_Time", # SystemTimeToFileTime: EXIF DateTaken (YYYY:MM:DD…) -> FILETIME for the property handler
    "Win32_System_WindowsProgramming", # MulDiv for the app dialogs' DPI scaling
    "Win32_UI_HiDpi", # GetDpiForWindow + SystemParametersInfoForDpi (PerMonitorV2 layout scaling)
    "Win32_UI_Accessibility", # SetWinEventHook(EVENT_SYSTEM_FOREGROUND): notice an ELEVATED window taking the foreground, the one Space-preview failure the keyboard hook can never see (its keys never arrive)
    "Win32_Storage_FileSystem", # Get/SetFileAttributesW for the folder-icon verb
    "Win32_Storage_Xps", # PrintWindow: render the Settings window to a PNG headlessly (the `--shot` verification mode)
    "Win32_UI_Shell",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_Storage_EnhancedStorage", # PKEY_* property keys (System.Image.*/Photo.*/Music.*) for the property handler
    "Win32_UI_Controls_Dialogs", # ChooseColorW / ChooseFontW for the screenshot colour + text pickers
    "Win32_Graphics_Gdi",
    "Win32_Graphics_GdiPlus", # anti-aliased annotation drawing in the screenshot tool
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Imaging",
    # Media Foundation: grab a representative frame for VIDEO thumbnails via the OS's
    # installed codecs (zero bundled bytes), streamed from disk via an IMFByteStream.
    "Win32_Media_MediaFoundation",
    "Win32_Globalization",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Diagnostics_Debug", # Read/WriteProcessMemory: read the focused row out of Everything 1.4's result list (it publishes no focus window, unlike 1.5)
    "Win32_System_Ole",
    "Win32_System_Registry",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Controls",
    "Win32_UI_Shell_Common",
    "Win32_UI_Input_KeyboardAndMouse",
    # WinRT: the OS PDF rasterizer (Windows.Data.Pdf) — PDF first-page thumbnails
    # with zero bundled bytes (no pdfium.dll, no Ghostscript). Windows 10+.
    "Data_Pdf",
    "Storage_Streams",
    "Foundation",
    # WinRT OCR (Windows.Media.Ocr) — image → text, in-box, zero bundled bytes.
    "Media_Ocr",
    "Graphics_Imaging",
    "Globalization",
]

# Toolchain is pinned to stable-x86_64-pc-windows-msvc (rust-toolchain.toml).

[profile.release]
panic = "abort"
opt-level = "z"
lto = true
strip = true
codegen-units = 1
# overflow-checks intentionally left at its release default (false), not omitted by
# oversight: the parsers that read untrusted file bytes (decode/, container/, mp4.rs,
# mkv.rs, streamsrc/…) are written to checked/saturating arithmetic BY CONVENTION on any
# file-controlled value, per CLAUDE.md section 2: that's what keeps a malformed input a
# controlled error instead of a silent wrap either way. Turning this on would double-pay
# the belt on every arithmetic op in the whole binary (formatting code, UI layout math,
# etc, not just parsers) for opt-level=z, where every byte and cycle already matters for
# an in-process shell extension. There's no scripted enforcement of the convention beyond
# clippy's arithmetic lints + code review; a real audit tool for "unchecked arithmetic on
# attacker-influenced values" is a static-analysis project of its own, not a Cargo.toml key.
