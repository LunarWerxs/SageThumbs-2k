tip_badge_icon = "Iguguhit ang badge bilang maliit na may-kulay na marka ng file — isang kulay bawat uri ng file (mga larawan, camera RAW, ebook, dokumento, audio, video, archive) — sa halip na plain text. Mas madaling makita sa isang sulyap. Alisan ng check para sa plain text chip."
tip_thumb_checker = "Maglalagay ng magaan na checkerboard sa likod ng mga transparent na bahagi ng thumbnail, para hindi mawala ang transparent na larawan sa background ng folder. Para lang sa mga Explorer thumbnail; may sariling switch ang mga preview window. Ang pagbabago nito ay nagbubura sa thumbnail cache."
tip_video_cover_art = "Kapag may naka-save na larawang cover sa loob ng isang video, ipapakita iyon sa halip na isang frame mula sa video. Pinakamainam para sa isang library ng mga pelikula; i-off ito para sa mga home video at screen recording, kung saan mas nagbibigay ng impormasyon ang tunay na frame. Ginagamit pa rin ang cover art kapag walang frame na ma-decode, anuman ang setting na ito. Ang pagbabago nito ay nagbubura sa thumbnail cache."
tip_hide_type_overlay = "Itinatatak ng Windows ang icon ng kaugnay na program sa sulok ng thumbnail, sa ibabaw ng format badge — at kapag na-uninstall na ang program na iyon, blangkong pahina na lang ang iginuguhit nito. Hinihiling nito sa Windows na huwag itong iguhit para sa mga uri ng file na hinahawakan ng SageThumbs. Maaaring bawiin: ang pag-alis ng check ay ibabalik ito."
