[package]
name = "sagethumbs2k-preview"
version.workspace = true
edition = "2021"
rust-version.workspace = true
publish = false
license = "PolyForm-Noncommercial-1.0.0"
description = "SageThumbs 2K app, preview layer"

# cargo-machete reads crate NAMES, so it misses `windows-core`, named only by the
# `#[implement]` macro's expansion. It is used.
[package.metadata.cargo-machete]
ignored = ["windows-core"]

[lib]
name = "st2k_preview"

[dependencies]
base64 = "0.23"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
image = { workspace = true }
# Quick preview: markdown -> block/inline events for the viewer's in-process GDI renderer
# (VIEWER / EXE-only). Pure-Rust, MIT, small — chosen over a WebView2 host to keep the binary
# lean + the render `--shot`-verifiable. Referenced ONLY from `src/bin/app/preview/**`, so LTO
# dead-strips it from the DLL. default-features off drops the `getopts` CLI bits.
pulldown-cmark = { version = "0.13", default-features = false }
serde_json = "1"
# WebView2 COM bindings for the Quick preview HTML host, OPTIONAL behind `html-preview`
# (EXE-only). 0.39 uses the same `windows` 0.62 the project already has (verified single-crate).
# Not bundled: the Edge engine ships with Win11; only WebView2Loader.dll (~150 KB) rides
# alongside the EXE.
webview2-com = { version = "0.39", optional = true }
windows = { workspace = true }
# The `#[implement]` macro (the video player's notify callback) expands to `windows_core::` paths.
windows-core = "0.62"
zip = { version = "8", default-features = false, features = ["deflate-flate2"] }
st2k_base = { package = "sagethumbs2k-base", path = "../base" }
st2k_codecs = { package = "sagethumbs2k-codecs", path = "../codecs" }
st2k_actions = { package = "sagethumbs2k-actions", path = "../actions" }
st2k_appkit = { package = "sagethumbs2k-appkit", path = "../appkit" }

[features]
# Quick preview's WebView2 HTML host (EXE-only; see the root Cargo.toml's `html-preview`,
# which turns this on).
html-preview = ["dep:webview2-com"]
