[package]
name = "sagethumbs2k-appkit"
version.workspace = true
edition = "2021"
rust-version.workspace = true
publish = false
license = "PolyForm-Noncommercial-1.0.0"
description = "SageThumbs 2K app, appkit layer"

# cargo-machete reads crate NAMES, so it misses `windows-core`, named only by the
# `#[implement]` macro's expansion. It is used.
[package.metadata.cargo-machete]
ignored = ["windows-core"]

[lib]
name = "st2k_appkit"

[dependencies]
base64 = "0.23"
ed25519-dalek = { version = "3", default-features = false }
image = { workspace = true }
percent-encoding = "2"
serde_json = "1"
windows = { workspace = true }
windows-registry = "0.6"
# `windows::core::implement` (the UI Automation list items) expands to `windows_core::` paths.
windows-core = "0.62"
st2k_base = { package = "sagethumbs2k-base", path = "../base" }
st2k_codecs = { package = "sagethumbs2k-codecs", path = "../codecs" }

[features]
# Test helpers the binary's own tests use (a crate's `cfg(test)` items do not exist when it is
# built as another crate's dependency). Only the root package's [dev-dependencies] turn it on.
testkit = []
