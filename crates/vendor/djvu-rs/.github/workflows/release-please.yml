name: Release Please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  # actions: write lets the dispatch-publish-packages job below start
  # publish-packages.yml via `gh workflow run` (workflow_dispatch).
  actions: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          # Use the built-in GITHUB_TOKEN — no dependency on an expiring PAT.
          # A dedicated RELEASE_PLEASE_TOKEN was previously used only so the release
          # PR would auto-trigger CI, but that PAT expired and silently broke the
          # 0.25.0 release ('Bad credentials'). Releases are now cut by manually
          # pushing the vX.Y.Z tag, which triggers publish.yml independently of this
          # workflow (see RELEASING.md), so the PAT is no longer on the release path.
          # Tradeoff: GitHub does not run workflows on events created by GITHUB_TOKEN,
          # so the release PR shows BLOCKED on never-run checks — nudge it
          # (close/reopen) or admin-merge to land the version bump, then push the tag.
          #
          # The same GITHUB_TOKEN restriction means the vX.Y.Z tag this action pushes
          # does NOT trigger publish-packages.yml's `push: tags:` filter (PyPI + npm)
          # — GitHub skips workflow runs for push events authored by GITHUB_TOKEN.
          # workflow_dispatch is explicitly exempt from that recursion guard (GitHub
          # docs: "workflow_dispatch and repository_dispatch events always create
          # workflow runs"), so the dispatch-publish-packages job below fires
          # publish-packages.yml via `gh workflow run ... workflow_dispatch` instead of
          # relying on the tag push, using nothing but this workflow's own GITHUB_TOKEN.
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created }}
    runs-on: ubuntu-latest
    environment: crates-io
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Publish crates to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail

          crates=(
            "djvu-zp:crates/djvu-zp/Cargo.toml"
            "djvu-iff:crates/djvu-iff/Cargo.toml"
            "djvu-bitmap:crates/djvu-bitmap/Cargo.toml"
            "djvu-pixmap:crates/djvu-pixmap/Cargo.toml"
            "djvu-bzz:crates/djvu-bzz/Cargo.toml"
            "djvu-jb2:crates/djvu-jb2/Cargo.toml"
            "djvu-iw44:crates/djvu-iw44/Cargo.toml"
            "djvu-rs:Cargo.toml"
          )

          for entry in "${crates[@]}"; do
            name="${entry%%:*}"
            manifest="${entry#*:}"
            version=$(sed -n 's/^version = "\(.*\)"/\1/p' "$manifest" | head -1)

            if cargo info "$name@$version" --registry crates-io >/dev/null 2>&1; then
              echo "$name $version already on crates.io — skipping."
              continue
            fi

            cargo publish -p "$name" --no-verify
            sleep 20

            for i in $(seq 1 30); do
              if cargo info "$name@$version" --registry crates-io >/dev/null 2>&1; then
                echo "$name $version is live."
                break
              fi
              if [ "$i" = 30 ]; then
                echo "::error::$name $version did not appear on crates.io within 5 minutes"
                exit 1
              fi
              echo "[$i/30] waiting for $name $version on crates.io..."
              sleep 10
            done
          done

  dispatch-publish-packages:
    name: Dispatch publish-packages (PyPI + npm)
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created }}
    runs-on: ubuntu-latest
    steps:
      # publish-packages.yml also listens for `push: tags:`, but the tag this
      # workflow just created was pushed by GITHUB_TOKEN, so that push event never
      # fires it (see the comment on the release-please step above). Start it
      # explicitly instead — workflow_dispatch is exempt from that guard, so this
      # works with the job's own GITHUB_TOKEN and needs no personal access token.
      - name: Trigger publish-packages.yml for ${{ needs.release-please.outputs.tag_name }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          set -euo pipefail
          gh workflow run publish-packages.yml \
            --repo "${{ github.repository }}" \
            -f "tag=$TAG"
