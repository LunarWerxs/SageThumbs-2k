name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# CI only reads the checkout and public dependency metadata.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build-test:
    name: build · clippy · test (windows-msvc)
    runs-on: windows-latest
    # .cargo/config.toml is intentionally local-only. Keep production binaries
    # self-contained on a clean runner instead of silently depending on that file.
    env:
      RUSTFLAGS: -C target-feature=+crt-static
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # rust-toolchain.toml pins stable-x86_64-pc-windows-msvc + clippy/rustfmt,
      # which rustup installs on first cargo invocation. No setup action needed.
      - name: Toolchain
        run: rustup show

      # build.rs embeds the exact product/version metadata that the payload gate
      # validates. GitHub's Windows image includes GNU binutils, but its exact
      # MinGW/MSYS2 location is runner-image-specific.
      - name: Release resource compiler
        shell: pwsh
        run: |
          $windresCommand = Get-Command windres.exe -CommandType Application `
            -ErrorAction SilentlyContinue | Select-Object -First 1
          $windres = if ($windresCommand) { $windresCommand.Source } else { $null }
          if (-not $windres) {
            $windres = @(
              'C:\mingw64\bin\windres.exe'
              'C:\msys64\mingw64\bin\windres.exe'
              'C:\msys64\ucrt64\bin\windres.exe'
              'C:\msys64\clang64\bin\windres.exe'
            ) | Where-Object { Test-Path -LiteralPath $_ -PathType Leaf } |
              Select-Object -First 1
          }
          if (-not $windres -and (Test-Path -LiteralPath 'C:\msys64')) {
            $windres = Get-ChildItem -LiteralPath 'C:\msys64' -Filter windres.exe `
              -File -Recurse -ErrorAction SilentlyContinue |
              Select-Object -First 1 -ExpandProperty FullName
          }
          if (-not $windres) {
            throw 'GitHub Windows runner did not provide windres; refusing metadata-free release binaries.'
          }
          Split-Path -Parent $windres |
            Out-File -LiteralPath $env:GITHUB_PATH -Append -Encoding utf8
          & $windres --version

      # Swatinem/rust-cache keys on the rustc version + Cargo.lock + job AND prunes
      # stale build artifacts before saving. The old hashFiles(Cargo.lock)-only
      # actions/cache did neither: it restored a wholesale `target/` across commits
      # (same key when Cargo.lock is unchanged), which accumulated into an intermittent
      # release-LTO link error ("unresolved external symbol core::panicking::assert_failed").
      - name: Cache cargo
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      # Build the exact two production feature sets in the same order as
      # build-release.ps1: full EXEs first, then the menu-translation-subset DLL.
      # This makes the raw payload budget a real PR gate rather than a synthetic
      # unit test of the checker.
      - name: Build production EXEs
        run: cargo build --release --locked -p sagethumbs2k --features webp-lossy,html-preview,hdr-capture
      - name: Build production slim DLL
        run: cargo build --release --locked -p sagethumbs2k-dll --features webp-lossy,dll-i18n-subset
      - name: Production Rust payload size
        shell: pwsh
        run: |
          $target = Join-Path (& ./scripts/_targetdir.ps1) 'release'
          ./scripts/check-release-rust-payload.ps1 -ArtifactDirectory $target

      # Integration tests (tests/) drive the built shell-extension DLL in-process the
      # way Explorer does: the COM thumbnail handshake (com_roundtrip) and the
      # IExplorerCommand verb flyout + invoke (explorer_command). They LoadLibrary the
      # cdylib from the target dir and link `sagethumbs2k_core`, and run
      # headless (no registration, no admin, no Explorer). `settings_gate` redirects
      # HKCU into a scratch hive and runs here; only the live packaged-registration
      # test is #[ignore]d.
      #
      # ORDER MATTERS — `cargo test --tests` rebuilds the core rlib and test binaries,
      # but it does NOT refresh the separate `sagethumbs2k-dll` workspace member whose
      # canonical debug DLL these tests load. Build the debug workspace immediately
      # beforehand so they never test a stale shell-extension DLL. (The old combined
      # cdylib+rlib collision was removed when the thin `dll/` wrapper became its own crate.)
      # Cargo's `--tests` selector runs every target with test=true in this
      # workspace: library unit tests, both binary unit-test targets, and tests/.
      # Keep the single invocation here so all of them share the freshly built DLL.
      - name: Build debug test DLL
        run: cargo build --locked
      - name: Unit and integration tests
        run: cargo test --locked --tests

      # Gates on ALL debug-profile clippy lints across every target (bins, lib, tests).
      # Any new warning is promoted to an error and fails the build. The tree is kept
      # warning-clean; intentional exceptions carry a local #[allow] with a reason.
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      # Formatting is the cheapest gate we have (no build, seconds) and it keeps
      # review diffs about the change rather than about whitespace. `cargo fmt --all`
      # fixes anything this reports; `scripts\verify.ps1 -Lint` runs it locally first.
      - name: Rustfmt
        run: cargo fmt --all --check

  # A native ARM64 runner catches architecture-specific Windows/COM/linker drift
  # that an x64 cross-build cannot. This is deliberately a Compact validation:
  # it builds only the Rust/OS-codec app (no staged ImageMagick payload and no
  # installer publishing) and runs the normal debug-profile test suite natively.
  arm64-compact:
    name: ARM64 Compact (native debug build · test)
    runs-on: windows-11-arm
    env:
      RUSTFLAGS: -C target-feature=+crt-static
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # rust-toolchain.toml pins the x64 host for the primary job. Select an
      # explicit ARM64 toolchain here so Cargo neither cross-compiles through
      # emulation nor silently tests x64 binaries on the ARM runner.
      - name: Install native ARM64 Rust toolchain
        run: rustup toolchain install stable-aarch64-pc-windows-msvc --profile minimal
      - name: Confirm native ARM64 host and toolchain
        shell: pwsh
        run: |
          if ([System.Runtime.InteropServices.RuntimeInformation]::OSArchitecture -ne 'Arm64') {
            throw "Expected a native ARM64 runner; got $([System.Runtime.InteropServices.RuntimeInformation]::OSArchitecture)."
          }
          rustup run stable-aarch64-pc-windows-msvc rustc -vV

      - name: Cache cargo
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      # No --release and no ImageMagick staging: this is the Compact runtime
      # path. The explicit target keeps artifacts separate from x64 and makes
      # `cargo test` execute the ARM64 test binaries on this native runner.
      - name: Build Compact ARM64 debug EXEs with shipping features
        run: cargo +stable-aarch64-pc-windows-msvc build --locked --target aarch64-pc-windows-msvc -p sagethumbs2k --features webp-lossy,html-preview,hdr-capture
      - name: Build Compact ARM64 debug DLL with shipping features
        run: cargo +stable-aarch64-pc-windows-msvc build --locked --target aarch64-pc-windows-msvc -p sagethumbs2k-dll --features webp-lossy,dll-i18n-subset
      - name: Run native ARM64 unit and integration tests
        run: cargo +stable-aarch64-pc-windows-msvc test --locked --tests --target aarch64-pc-windows-msvc
      - name: Verify ARM64 PE artifacts and Compact payload
        shell: pwsh
        run: |
          $target = Join-Path (& ./scripts/_targetdir.ps1) 'aarch64-pc-windows-msvc\debug'
          $artifacts = @(
            (Join-Path $target 'SageThumbs2K.exe')
            (Join-Path $target 'st2k.exe')
            (Join-Path $target 'sagethumbs2k.dll')
          )
          foreach ($artifact in $artifacts) {
            if (-not (Test-Path -LiteralPath $artifact -PathType Leaf)) {
              throw "Missing ARM64 artifact: $artifact"
            }
            $bytes = [System.IO.File]::ReadAllBytes($artifact)
            if ($bytes.Length -lt 64 -or $bytes[0] -ne 0x4d -or $bytes[1] -ne 0x5a) {
              throw "Not a PE file: $artifact"
            }
            $peOffset = [BitConverter]::ToInt32($bytes, 0x3c)
            if ($peOffset -lt 0 -or $peOffset + 6 -gt $bytes.Length) {
              throw "Invalid PE header offset: $artifact"
            }
            $machine = [BitConverter]::ToUInt16($bytes, $peOffset + 4)
            if ($machine -ne 0xaa64) {
              throw ('Expected ARM64 PE machine 0xAA64; {0} is 0x{1:X4}' -f $artifact, $machine)
            }
          }
          if (Get-ChildItem -LiteralPath $target -Filter magick.exe -File -Recurse -ErrorAction SilentlyContinue) {
            throw 'Compact ARM64 validation must not stage ImageMagick.'
          }
          & (Join-Path $target 'st2k.exe') --help
          if ($LASTEXITCODE -ne 0) { throw 'Native ARM64 st2k smoke test failed.' }

      # The ARM64 release gate used to end in "install it on a real ARM64 device and
      # right-click something in Explorer", which needs hardware nobody here has: an x64
      # host cannot run an ARM64 Windows guest, so that gate could never actually be run
      # on demand and it held the release hostage.
      #
      # Most of it does not need a desktop at all. Explorer gets its thumbnail through
      # IShellItemImageFactory and hosts the preview through IPreviewHandler, and both are
      # COM calls that work fine in a non-interactive session. So the real question -
      # "does the registered handler LOAD on this architecture and return a correct
      # image?" - gets answered here, on native ARM64 silicon, on every push. Hosted
      # Windows runners are administrators, so regsvr32 works; the script always
      # unregisters, including on failure.
      #
      # Still NOT covered, and deliberately so: the pixels of Explorer's own right-click
      # flyout, which need an interactive desktop. That is Windows shell chrome driving
      # architecture-independent Rust, so it is a spot-check, not a release gate.
      - name: Prove the registered ARM64 shell surfaces (thumbnail + preview)
        shell: pwsh
        run: |
          $target = Join-Path (& ./scripts/_targetdir.ps1) 'aarch64-pc-windows-msvc\debug'
          & ./scripts/test-installed-shell-surfaces.ps1 `
              -TargetDir $target `
              -ArtifactDir (Join-Path $env:RUNNER_TEMP 'arm64-shell-surfaces')

  # Cargo.toml publishes 1.93 as the minimum supported Rust version. The main job
  # intentionally follows current stable, so exercise the lower bound separately
  # instead of letting source/API drift make the declared MSRV fictional.
  msrv:
    name: MSRV (Rust 1.93)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install Rust 1.93 MSVC
        run: rustup toolchain install 1.93.0-x86_64-pc-windows-msvc --profile minimal
      - name: Check workspace at MSRV
        run: cargo +1.93.0-x86_64-pc-windows-msvc check --locked --workspace

  # Drift guard (no build needed): every asset referenced by include_bytes!/include_str!
  # or a README/docs <img> must be git-tracked; the README badge + FEATURES format count
  # must match src/formats.rs FORMATS; the AppxManifest version must match Cargo.toml.
  # Catches the "referenced-but-not-committed" + version/count drift classes that have
  # broken releases — fails fast, before anything ships. See scripts/check-consistency.ps1.
  consistency:
    name: consistency (assets · counts · version)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: check-consistency
        shell: pwsh
        run: ./scripts/check-consistency.ps1
      - name: release-size policy tests
        shell: pwsh
        run: ./scripts/test-release-size.ps1
      - name: release provenance and curated-notes tests
        shell: pwsh
        run: ./scripts/test-release-pipeline.ps1
      - name: installer cleanup and uninstaller-safety tests
        shell: pwsh
        run: ./scripts/test-installer-lint.ps1
      - name: MSIX signature, signer, and identity tests
        shell: pwsh
        run: ./scripts/test-msix-integrity.ps1
      - name: architecture-specific release and VM helper tests
        shell: pwsh
        run: ./scripts/test-architecture-release-contract.ps1
      - name: architecture-specific developer helper tests
        shell: pwsh
        run: ./scripts/test-dev-architecture.ps1
      - name: ImageMagick dependency freshness parser tests
        shell: pwsh
        run: ./scripts/test-magick-dependency-freshness.ps1
      - name: vendored exr provenance and local-resolution check
        shell: pwsh
        run: ./scripts/check-vendored-exr.ps1

  # The patched dependency is excluded from the application workspace, so its
  # own tests do not run under `cargo test --workspace`. Keep the focused,
  # asset-free DWA suite explicit until the patch is removed after upstreaming.
  # Upstream's standalone library intentionally excludes Cargo.lock; application
  # resolution and the root DWA integration test remain locked in build-test.
  vendored-exr:
    name: vendored exr (DWA patch)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Toolchain
        run: rustup show
      - name: Cache cargo
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: DWA library tests
        run: 'cargo test --manifest-path vendor/exr/Cargo.toml --no-default-features --lib compression::dwa::'
      - name: DWAA and DWAB roundtrips
        run: cargo test --manifest-path vendor/exr/Cargo.toml --no-default-features --test roundtrip roundtrip_dwa

  # License + advisory + source/ban audit. The whole dependency graph is now
  # 100% permissive (RAR/CBR via the pure-Rust `rars` crate — no proprietary
  # UnRAR anywhere), so this proves the build is license-clean. Config +
  # allowlist live in deny.toml.
  deny:
    name: cargo-deny (licenses · advisories — default features)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # rust-toolchain.toml pins stable-x86_64-pc-windows-msvc, which rustup can't
      # use on this Linux runner ("target triple in channel name"). cargo-deny only
      # needs `cargo metadata` (toolchain-agnostic; the windows-msvc *target* is set
      # in deny.toml), so drop the pin here and let the action's Linux toolchain run.
      - name: Drop windows-only toolchain pin (Linux runner)
        run: rm -f rust-toolchain.toml
      - name: cargo-deny
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          # Checks the committed Cargo.lock (advisories + licenses) against
          # deny.toml's allowlist over the full (now fully-permissive) graph.
          # deny.toml lives at the repo root (cargo-deny's default location), so
          # no --config flag is needed — robust across cargo-deny versions
          # (newer cargo-deny moved --config to a global flag before `check`).
          command: check
          arguments: --locked
