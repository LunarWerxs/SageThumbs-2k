# Publish a release to the Windows Package Manager (winget).
#
# ============================================================================================
# THIS WORKFLOW IS NO LONGER THE PUBLISHING PATH, AND IT NEEDS NO SECRET.
#
# `scripts/release.ps1` submits to winget directly, on the maintainer's machine, by calling
# `scripts/winget-submit.ps1`. That script does the whole job with the LOCAL `gh` login: read
# the release's own published sha256 digests, rewrite the manifest triplet, sync the fork, push
# the branch, open the pull request. It needs no PAT, and there is nothing to expire.
#
# WHY THE CI PATH WAS ABANDONED (2026-08-14). It failed silently for a year, and the failure
# mode was worse than not having it:
#   * a classic PAT expired after 1.7.2, so 1.7.3 and 1.7.4 never published;
#   * the fine-grained PAT that replaced it on 2026-08-06 was answering 401 within two hours;
#   * the onboarding guard treated ANY non-200 as "package not onboarded yet" and skipped the
#     whole job with a GREEN TICK, so nine consecutive releases (1.8.2 .. 1.12.0) reported
#     success while publishing nothing, and winget users sat on 1.8.1 for a week.
# The token was reissued several times. It could never have worked in the shape it was asked
# to: a fine-grained PAT only carries permissions on repositories its owner OWNS, so
# `POST /repos/microsoft/winget-pkgs/pulls` is 403 by construction, and a classic PAT is a
# credential that expires and must be re-minted forever. The recurring "the token is dead
# again" was the symptom; needing a token at all was the disease.
#
# So: the WINGET_TOKEN secret can be DELETED. Nothing here or in release.ps1 reads it.
# ============================================================================================
#
# What remains is a MANUAL fallback for the case where the maintainer's machine is not
# available. It is `workflow_dispatch` only - deliberately NOT triggered by a release, because
# release.ps1 already submits and two submitters would race to open duplicate pull requests.
#
# It uses the built-in GITHUB_TOKEN, which is minted per run, always valid, and never needs
# provisioning. That is enough for the read below. It is NOT enough for Komac to push a branch
# to the fork, which is precisely why this path is a diagnostic rather than a publisher: it
# tells you whether the package is onboarded and whether the fork is in a state that would
# work, then points at the script that actually does the submission.
#
# Historical note kept because it costs a day every time it is rediscovered: when Komac fails
# with "<owner> does not have the correct permissions to execute `CreateRef`", the cause is a
# STALE FORK, not permissions. `gh repo sync LunarWerxs/winget-pkgs --source microsoft/winget-pkgs`
# fixes it. The error text lies about the cause.
name: Check winget submission state

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to check, without the leading v (e.g. 1.12.0)
        required: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # Read-only, against a PUBLIC repository, with the run's own built-in token. Only 404
      # means "not onboarded"; anything else that is not 200 is a broken setup and must fail
      # loudly rather than be swallowed as a skip. That distinction is the entire lesson of the
      # 1.8.2 .. 1.12.0 silent-skip incident described above.
      - name: Report winget state
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
        run: |
          pkg=manifests/l/LunarWerxs/SageThumbs2K
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/microsoft/winget-pkgs/contents/$pkg")
          case "$code" in
            200) echo "package is onboarded to winget-pkgs." ;;
            404)
              echo "::error title=Not onboarded::LunarWerxs.SageThumbs2K is not in winget-pkgs. The FIRST submission must be merged by hand (komac new)."
              exit 1
              ;;
            *)
              echo "::error title=Unexpected HTTP $code::Could not read a public repository's contents. Nothing was checked."
              exit 1
              ;;
          esac

          echo "latest published versions:"
          curl -s -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/microsoft/winget-pkgs/contents/$pkg" \
            | jq -r '.[] | select(.type=="dir") | .name' | sort -V | tail -5

          if [ -n "$VERSION" ]; then
            open=$(gh pr list --repo microsoft/winget-pkgs --state all --limit 30 \
              --search "LunarWerxs.SageThumbs2K version $VERSION in:title" \
              --json number,state,url --jq '.[0] | "\(.number) \(.state) \(.url)"' 2>/dev/null)
            if [ -n "$open" ] && [ "$open" != "null" ]; then
              echo "pull request for $VERSION: $open"
            else
              echo "::warning title=No pull request for $VERSION::Submit it from the maintainer's machine: pwsh scripts/winget-submit.ps1 -Version $VERSION"
            fi
          fi

          echo
          echo "To PUBLISH a version, run this on the maintainer's machine (no secret needed):"
          echo "    pwsh scripts/winget-submit.ps1 -Version <x.y.z>"
