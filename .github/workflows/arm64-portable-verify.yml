# Run the SHIPPED ARM64 portable zip on real ARM64 silicon.
#
# Why this exists, given ci.yml already has an ARM64 job: that job proves portable MODE using
# debug binaries it assembles itself, and deliberately skips the ImageMagick payload. The zip
# we actually publish is never executed by anything. `build-release.ps1 -Portable` skips its own
# smoke test when cross-building (an x64 box cannot run ARM64 code at all), and the packaging
# checks read the ARM64 DLLs' import tables rather than running them. So a bundled ARM64
# ImageMagick that loads on nobody's machine would pass every existing gate and reach users.
#
# This closes that by downloading the release asset itself and running it. Since 2026-09-08
# it is also a GATE: release.ps1 dispatches it against the DRAFT release at step [5a/6] and
# publishes only on green, so a broken ARM64 payload never becomes downloadable. The
# `release: published` trigger stays as the record for anything published another way.
name: ARM64 portable verify

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to verify (e.g. v1.12.0)'
        required: true
        type: string

permissions:
  # write, not read: a DRAFT release (the pre-publish gate case) is only visible to a token
  # with push access. Nothing here writes; the download below is a plain asset GET.
  contents: write

jobs:
  verify:
    name: run the published ARM64 portable zip on ARM64
    runs-on: windows-11-arm
    steps:
      - name: Resolve the tag
        id: tag
        shell: pwsh
        run: |
          $tag = if ('${{ github.event_name }}' -eq 'workflow_dispatch') {
            '${{ inputs.tag }}'
          } else {
            '${{ github.event.release.tag_name }}'
          }
          if (-not $tag) { throw 'no tag resolved' }
          "tag=$tag" >> $env:GITHUB_OUTPUT
          Write-Host "verifying $tag"

      - name: Confirm this really is ARM64 silicon
        shell: pwsh
        run: |
          # The whole point of this job is the hardware. If it ever silently lands on an x64
          # runner, every assertion below would still pass under emulation-that-does-not-exist,
          # or worse, pass against the wrong binaries. Fail loudly instead.
          $arch = $env:PROCESSOR_ARCHITECTURE
          Write-Host "PROCESSOR_ARCHITECTURE = $arch"
          if ($arch -ne 'ARM64') { throw "expected ARM64 host, got '$arch'" }

      - name: Download the ARM64 portable zip (draft or published release)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ steps.tag.outputs.tag }}'
          $ver = $tag.TrimStart('v')
          $asset = "SageThumbs2K-Portable-$ver-arm64.zip"
          $repo = '${{ github.repository }}'
          # Not `gh release download <tag>`: that resolves through /releases/tags/, which never
          # returns a DRAFT, and the pre-publish gate runs against exactly that. List the
          # releases (drafts included for a push-access token) and fetch the asset by id.
          $assetId = gh api "repos/$repo/releases?per_page=30" `
            --jq ".[] | select(.tag_name == `"$tag`") | .assets[] | select(.name == `"$asset`") | .id" 2>&1
          if ($LASTEXITCODE -ne 0 -or -not "$assetId".Trim()) { throw "no asset $asset on release $tag (draft or published): $assetId" }
          $assetId = ("$assetId" -split "`n")[0].Trim()
          $zip = Join-Path $env:RUNNER_TEMP $asset
          # Invoke-WebRequest, not `gh api ... > file`: a pwsh redirection re-encodes the bytes
          # as text. pwsh 7 drops the Authorization header on the cross-host redirect to the
          # asset CDN, which is what that CDN requires.
          Invoke-WebRequest -Uri "https://api.github.com/repos/$repo/releases/assets/$assetId" `
            -Headers @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = 'application/octet-stream'; 'X-GitHub-Api-Version' = '2022-11-28' } `
            -OutFile $zip -MaximumRedirection 5
          if (-not (Test-Path $zip) -or (Get-Item $zip).Length -lt 1MB) { throw "could not download asset $assetId ($asset) from $tag" }
          "zip=$zip" >> $env:GITHUB_ENV
          Write-Host ("downloaded {0:N2} MB" -f ((Get-Item $zip).Length / 1MB))

      - name: Extract to a folder it was never installed to
        shell: pwsh
        run: |
          $drop = Join-Path $env:RUNNER_TEMP 'portable-run'
          Remove-Item $drop -Recurse -Force -ErrorAction SilentlyContinue
          Expand-Archive -LiteralPath $env:zip -DestinationPath $drop -Force
          "drop=$drop" >> $env:GITHUB_ENV
          Get-ChildItem $drop | Select-Object -First 12 Name, Length | Format-Table -AutoSize

      - name: Our own binaries run from the zip
        shell: pwsh
        run: |
          $st2k = Join-Path $env:drop 'st2k.exe'
          if (-not (Test-Path $st2k)) { throw 'st2k.exe missing from the portable zip' }
          # `formats` is the check the local smoke test makes, and it exercises real work
          # (it reads the format table) rather than just printing a version string.
          $out = & $st2k formats 2>&1 | Out-String
          if ($LASTEXITCODE -ne 0) { Write-Host $out; throw "st2k formats failed ($LASTEXITCODE)" }
          if ($out -notmatch '(?i)png') { Write-Host $out; throw 'format list looks empty' }
          Write-Host ($out -split "`n" | Select-Object -First 5 | Out-String)

      - name: The bundled ARM64 ImageMagick actually loads
        shell: pwsh
        run: |
          # THE point of this job. Everything else about the payload is verified by reading
          # PE headers and import tables; nothing runs it. A wrong-architecture or
          # missing-dependency magick would sail through those static checks.
          $magick = Join-Path $env:drop 'magick.exe'
          if (-not (Test-Path $magick)) { throw 'magick.exe missing from the portable zip' }
          $ver = & $magick -version 2>&1 | Out-String
          if ($LASTEXITCODE -ne 0) { Write-Host $ver; throw "bundled ARM64 magick failed to run ($LASTEXITCODE)" }
          Write-Host $ver
          # Converting must be driven THROUGH st2k, not by calling magick directly.
          # `decode/magick.rs` sets MAGICK_HOME, MAGICK_CODER_MODULE_PATH and friends before
          # spawning, precisely because a bare magick.exe on Windows looks its coder modules up
          # in the registry and fails with RegistryKeyLookupFailed 'CoderModulesPath' when there
          # is no installed copy. Invoking it bare therefore tests an integration the product
          # does not use, and reports a failure that does not exist.
          #
          # DDS is the lever: it is an exotic output target with no pure-Rust encoder, so
          # `st2k convert` to it can ONLY succeed by driving the bundled engine successfully.
          $st2k = Join-Path $env:drop 'st2k.exe'
          $src = Join-Path $env:drop 'probe.png'
          $dst = Join-Path $env:drop 'probe.dds'
          [IO.File]::WriteAllBytes($src, [Convert]::FromBase64String(
            'iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mP8z8BQDwAEhQGAhKmMIQAAAABJRU5ErkJggg=='))
          $out = & $st2k convert $src $dst 2>&1 | Out-String
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path $dst)) {
            Write-Host $out
            throw 'st2k could not drive the bundled ARM64 ImageMagick (DDS encode failed)'
          }
          Write-Host "ARM64 engine round-trip OK: PNG -> DDS ($((Get-Item $dst).Length) bytes)"

      # The decoders added in 2.0 had never been EXECUTED on ARM64 by anything, only compiled.
      # That gap was invisible because the compile side genuinely is covered: `flash-video` is a
      # DEFAULT feature and `build-release.ps1` computes the same EXE feature set for both
      # architectures, so ARM64 users do get the codecs. What no job did was decode with them.
      #
      # It matters most for the out-of-process ones. VP6 and Sorenson are decoded by nihav and
      # h263-rs inside a spawned `st2k flv-frame` child that caps its own memory with a job
      # object, so this exercises bitstream maths, a process spawn, and the job-object call on
      # ARM64 silicon at once. (Neither decoder carries an x86-only fast path - both were
      # grepped for x86 intrinsics and have none - so the risk was never a silent slow path,
      # it was that nobody had ever run them here at all.)
      #
      # Driven THROUGH st2k for the same reason the magick probe above is: it must test the
      # integration the product actually uses.
      - name: The new decoders actually decode on ARM64 silicon
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $st2k = Join-Path $env:drop 'st2k.exe'
          # Sorenson Spark FLV: the decoder runs in the spawned child, not in-process.
          # Hash-pinned: an unpinned third-party download that gets fed straight to a decoder
          # is exactly the "SHA-256 per URL, fail loudly on mismatch" gap check-magick-source.ps1
          # and check-vendored-exr.ps1 already close for their own downloads.
          $flv = Join-Path $env:drop 'probe.flv'
          Invoke-WebRequest 'https://fate-suite.ffmpeg.org/flash-vp6/clip1024.flv' `
            -OutFile $flv -UseBasicParsing -TimeoutSec 120
          $flvHash = (Get-FileHash -LiteralPath $flv -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($flvHash -ne 'f61d4a1696000cbb6d1e6a8bd7e4682656da3ad017c49fd6d7c47a7f28d8aefe') {
            throw "clip1024.flv hash mismatch: expected f61d4a1696000cbb6d1e6a8bd7e4682656da3ad017c49fd6d7c47a7f28d8aefe, got $flvHash"
          }
          $png = Join-Path $env:drop 'probe-flv.png'
          $out = & $st2k thumbnail $flv $png 2>&1 | Out-String
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path $png)) {
            Write-Host $out
            throw 'VP6 FLV did not decode on ARM64 (the st2k flv-frame child path)'
          }
          Write-Host "ARM64 VP6 decode OK ($((Get-Item $png).Length) bytes)"

          # Android package: binary XML + resources.arsc, parsed IN-PROCESS. Different risk
          # class from the video path, so it gets its own assertion rather than riding along.
          $apk = Join-Path $env:drop 'probe.apk'
          Invoke-WebRequest 'https://raw.githubusercontent.com/androguard/androguard/0c0af30ca6bd55d3d34aa10d7f32593cd091a483/tests/data/APK/TestActivity.apk' `
            -OutFile $apk -UseBasicParsing -TimeoutSec 120
          $apkHash = (Get-FileHash -LiteralPath $apk -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($apkHash -ne '3bb32dd50129690bce850124ea120aa334e708eaa7987cf2329fd1ea0467a0eb') {
            throw "TestActivity.apk hash mismatch: expected 3bb32dd50129690bce850124ea120aa334e708eaa7987cf2329fd1ea0467a0eb, got $apkHash"
          }
          $apkPng = Join-Path $env:drop 'probe-apk.png'
          $out = & $st2k thumbnail $apk $apkPng 2>&1 | Out-String
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path $apkPng)) {
            Write-Host $out
            throw 'APK launcher icon did not resolve on ARM64'
          }
          Write-Host "ARM64 APK decode OK ($((Get-Item $apkPng).Length) bytes)"

      - name: Portable mode is on, and it is the ini that does it
        shell: pwsh
        run: |
          # The marker ini ships INSIDE the zip, so unlike ci.yml's synthetic check this proves
          # the real payload's portability. Distinctive values make the answer observable, and
          # the negative control is the load-bearing half.
          $st2k = Join-Path $env:drop 'st2k.exe'
          $iniName = 'SageThumbs2K.ini'
          if (-not (Test-Path (Join-Path $env:drop $iniName))) {
            throw "the portable marker $iniName is missing from the zip - it IS the switch"
          }
          Set-Content (Join-Path $env:drop $iniName) -Value @('[Settings]', 'MaxSize=42', 'Width=137', 'Height=137')
          $report = & $st2k doctor 2>&1 | Out-String
          if ($report -notmatch '137') {
            Write-Host $report
            throw 'portable ini was ignored: doctor did not report the ini values'
          }
          Write-Host 'portable ini honoured on ARM64'
