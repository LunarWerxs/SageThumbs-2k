tip_badge_icon = "Disegna il badge come un piccolo contrassegno colorato per tipo di file - un colore per ogni categoria (immagini, RAW fotocamera, ebook, documenti, audio, video, archivi) - anziché come testo semplice. Più facile da individuare a colpo d'occhio. Deseleziona per il badge testuale semplice."
tip_corner_mark = "Solo una cosa può stare nell'angolo in basso a destra di una miniatura. “Icona del tipo di file di Windows” lascia decidere ad Explorer, che vi disegna l'icona del programma associato (una pagina vuota se quel programma è stato disinstallato). “Badge del formato SageThumbs” mostra invece il formato del file (PSD, JXL, AVIF…), così puoi distinguere i formati a colpo d'occhio, e impedisce ad Explorer di sovrascriverlo. “Niente” lascia l'immagine senza alcun contrassegno. La modifica cancella la cache delle miniature."
tip_thumb_checker = "Disegna una leggera scacchiera dietro le parti trasparenti di una miniatura, così un'immagine trasparente non scompare nello sfondo della cartella. Solo per le miniature di Esplora file; le finestre di anteprima hanno un interruttore separato. Modificarlo svuota la cache delle miniature."
tip_folder_prebuild = "Aggiunge una voce \"Crea le miniature qui\" al menu contestuale di cartelle e unità. Analizza la cartella e crea in anticipo le miniature, così le immagini sono già pronte alla prima apertura. Utile dopo aver svuotato la cache delle miniature o copiato una libreria di grandi dimensioni."
