tip_badge_icon = "Dibuja el distintivo como una pequeña marca de archivo en color — un color por tipo de archivo (imágenes, RAW de cámara, libros electrónicos, documentos, audio, vídeo, archivos comprimidos) — en lugar de texto simple. Más fácil de detectar de un vistazo. Desmarca para la etiqueta de texto simple."
tip_corner_mark = "Solo una cosa puede ocupar la esquina inferior derecha de una miniatura. “Icono de tipo de archivo de Windows” se lo deja a Explorer, que dibuja ahí el icono del programa asociado (una página en blanco si ese programa se ha desinstalado). “Un distintivo de formato de SageThumbs” coloca ahí el formato del archivo (PSD, JXL, AVIF…) en su lugar, para distinguir formatos de un vistazo, y evita que Explorer lo sobrescriba. “Nada” deja la imagen sin adornos. Cambiar esto vacía la caché de miniaturas."
tip_thumb_checker = "Pinta un tablero de ajedrez claro tras las partes transparentes de una miniatura, para que una imagen transparente no desaparezca en el fondo de la carpeta. Solo afecta a las miniaturas del Explorador; las ventanas de vista previa tienen su propio interruptor. Cambiar esto borra la caché de miniaturas."
tip_folder_prebuild = "Añade una entrada \"Generar miniaturas aquí\" al menú contextual de carpetas y unidades. Recorre la carpeta y genera las miniaturas por adelantado, para que las imágenes ya estén ahí la primera vez que la abras. Útil después de vaciar la caché de miniaturas o copiar una biblioteca grande."
