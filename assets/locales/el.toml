tip_badge_icon = "Σχεδιάζει το σήμα ως μικρό έγχρωμο σημάδι αρχείου — ένα χρώμα ανά είδος αρχείου (εικόνες, RAW φωτογραφικής μηχανής, e-books, έγγραφα, ήχος, βίντεο, συμπιεσμένα αρχεία) — αντί για απλό κείμενο. Πιο εύκολο να το εντοπίσετε με μια ματιά. Αποεπιλέξτε για απλή ετικέτα κειμένου."
tip_corner_mark = "Μόνο ένα στοιχείο χωράει στην κάτω δεξιά γωνία μιας μικρογραφίας. Το “Εικονίδιο τύπου αρχείου των Windows” το αφήνει στον Explorer, ο οποίος σχεδιάζει εκεί το εικονίδιο του συσχετισμένου προγράμματος (μια κενή σελίδα όταν αυτό το πρόγραμμα έχει απεγκατασταθεί). Το “Σήμα μορφής SageThumbs” τοποθετεί εκεί τη μορφή του αρχείου (PSD, JXL, AVIF…) αντ’ αυτού, ώστε να ξεχωρίζετε τις μορφές με μια ματιά, και εμποδίζει τον Explorer να ζωγραφίζει από πάνω του. Το “Τίποτα” αφήνει την εικόνα χωρίς σήμα. Η αλλαγή καθαρίζει την προσωρινή μνήμη μικρογραφιών."
tip_thumb_checker = "Ζωγραφίζει ένα ανοιχτόχρωμο καρό πίσω από τα διάφανα τμήματα μιας μικρογραφίας, ώστε μια διαφανής εικόνα να μη χάνεται μέσα στο φόντο του φακέλου. Ισχύει μόνο για τις μικρογραφίες της Εξερεύνησης· τα παράθυρα προεπισκόπησης έχουν δικό τους διακόπτη. Η αλλαγή καθαρίζει την προσωρινή μνήμη μικρογραφιών."
tip_folder_prebuild = "Προσθέτει μια καταχώριση \"Δημιουργία μικρογραφιών εδώ\" στο μενού δεξιού κλικ για φακέλους και δίσκους. Διατρέχει τον φάκελο και δημιουργεί εκ των προτέρων τις μικρογραφίες, ώστε οι εικόνες να υπάρχουν ήδη την πρώτη φορά που τον ανοίγετε. Χρήσιμο μετά τον καθαρισμό της προσωρινής μνήμης μικρογραφιών ή την αντιγραφή μιας μεγάλης βιβλιοθήκης."
