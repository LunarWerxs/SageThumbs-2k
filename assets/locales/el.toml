tip_video_cover_art = "Όταν ένα βίντεο έχει αποθηκευμένη μέσα του μια εικόνα εξωφύλλου, εμφανίζεται αυτή αντί για ένα καρέ από το βίντεο. Ιδανικό για μια βιβλιοθήκη ταινιών· απενεργοποιήστε το για οικιακά βίντεο και καταγραφές οθόνης, όπου ένα πραγματικό καρέ δίνει περισσότερες πληροφορίες. Το εξώφυλλο χρησιμοποιείται ούτως ή άλλως όταν δεν μπορεί να αποκωδικοποιηθεί κανένα καρέ, όποια κι αν είναι αυτή η ρύθμιση. Η αλλαγή καθαρίζει την προσωρινή μνήμη μικρογραφιών."
