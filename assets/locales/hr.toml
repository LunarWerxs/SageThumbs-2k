menu_upload = "Učitaj (kopiraj vezu)"
tip_shot_use_dir = "Ctrl+S u uređivaču snimke sprema izravno u odabranu mapu — bez upita Spremi kao. Isključite ako želite da vas se svaki put pita gdje spremiti."
