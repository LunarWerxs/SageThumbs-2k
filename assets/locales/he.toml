tip_badge_icon = "מצייר את התג כסימון קובץ צבעוני קטן - צבע אחד לכל סוג קובץ (תמונות, RAW של מצלמה, ספרים דיגיטליים, מסמכים, שמע, וידאו, ארכיונים) - במקום טקסט רגיל. קל יותר להבחין במבט חטוף. בטלו את הסימון כדי לקבל את תג הטקסט הרגיל."
tip_corner_mark = "רק דבר אחד יכול להופיע בפינה הימנית התחתונה של תמונה ממוזערת. “סמל סוג הקובץ של Windows” משאיר את זה לטיפולו של Explorer, שמצייר שם את הסמל של התוכנה המשויכת (דף ריק כאשר התוכנה הוסרה). “תג פורמט של SageThumbs” מציב שם את פורמט הקובץ (PSD, JXL, AVIF…) במקום זאת, כך שתוכלו להבחין בין הפורמטים במבט חטוף, ומונע מ-Explorer לצייר מעליו. “כלום” משאיר את התמונה חשופה. שינוי הגדרה זו מנקה את מטמון התמונות הממוזערות."
tip_thumb_checker = "מצייר תבנית משבצות בהירה מאחורי החלקים השקופים של תמונה ממוזערת, כך שתמונה שקופה לא תיעלם לתוך רקע התיקייה. חל רק על תמונות ממוזערות בסייר; לחלונות התצוגה המקדימה יש מתג משלהם. שינוי הגדרה זו מנקה את מטמון התמונות הממוזערות."
tip_folder_prebuild = "מוסיף פריט \"בניית תמונות ממוזערות כאן\" לתפריט הלחיצה הימנית של תיקיות וכוננים. הוא סורק את התיקייה ובונה מראש את התמונות הממוזערות, כך שהתמונות כבר יהיו שם בפעם הראשונה שתפתחו אותה. שימושי אחרי ניקוי מטמון התמונות הממוזערות או העתקת ספרייה גדולה."
