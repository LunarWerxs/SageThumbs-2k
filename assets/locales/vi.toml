tip_corner_mark = "Góc dưới bên phải của hình thu nhỏ chỉ có thể hiển thị một thứ. “Biểu tượng loại tệp Windows” để mặc cho Explorer quyết định — nó vẽ biểu tượng của chương trình liên kết với tệp đó (một trang trống nếu chương trình đó đã bị gỡ cài đặt). “Huy hiệu định dạng SageThumbs” thay vào đó hiển thị định dạng của tệp (PSD, JXL, AVIF…) tại góc đó, giúp bạn phân biệt định dạng chỉ bằng một cái nhìn và ngăn Explorer vẽ đè lên. “Không có gì” để hình ảnh hoàn toàn trống trơn. Thay đổi mục này sẽ xóa bộ nhớ đệm hình thu nhỏ."
tip_thumb_checker = "Vẽ một lớp ô cờ nhạt phía sau phần trong suốt của hình thu nhỏ, để ảnh trong suốt không biến mất vào nền thư mục. Chỉ áp dụng cho hình thu nhỏ trong Explorer; các cửa sổ xem trước có công tắc riêng. Thay đổi tùy chọn này sẽ xóa bộ nhớ đệm hình thu nhỏ."
tip_folder_prebuild = "Thêm mục \"Tạo hình thu nhỏ tại đây\" vào menu chuột phải của thư mục và ổ đĩa. Mục này sẽ quét qua thư mục và tạo trước các hình thu nhỏ, để hình ảnh đã sẵn sàng ngay lần đầu bạn mở thư mục. Hữu ích sau khi xóa bộ nhớ đệm hình thu nhỏ hoặc sao chép vào một thư viện lớn."
