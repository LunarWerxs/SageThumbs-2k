tip_corner_mark = "Apenas uma coisa pode ocupar o canto inferior direito de uma miniatura. “Ícone de tipo de arquivo do Windows” deixa a cargo do Explorer, que desenha ali o ícone do programa associado (uma página em branco quando esse programa foi desinstalado). “Marca de formato do SageThumbs” coloca ali o formato do arquivo (PSD, JXL, AVIF…) em vez disso, para você distinguir formatos num relance, e impede que o Explorer desenhe por cima. “Nada” deixa a imagem limpa. Alterar isso limpa o cache de miniaturas."
