tip_badge_icon = "Iguguhit ang badge bilang maliit na may-kulay na marka ng file — isang kulay bawat uri ng file (mga larawan, camera RAW, ebook, dokumento, audio, video, archive) — sa halip na plain text. Mas madaling makita sa isang sulyap. Alisan ng check para sa plain text chip."
tip_corner_mark = "Iisa lang ang puwedeng nasa ibabang-kanang sulok ng thumbnail. Ang “Icon ng Windows ayon sa uri ng file” ay iniiwan sa Explorer, na siyang gumuguhit doon ng icon ng kaugnay na program (isang blangkong pahina kapag na-uninstall na ang program na iyon). Ang “Marka ng format ng SageThumbs” naman ang naglalagay doon ng format ng file (PSD, JXL, AVIF…) sa halip, para mas madaling makilala ang mga format sa isang sulyap, at pinipigilan nito ang Explorer na gumuhit doon. Sa “Wala”, mananatiling hubad ang larawan. Nagbubura ng thumbnail cache ang pagbabago nito."
tip_thumb_checker = "Maglalagay ng magaan na checkerboard sa likod ng mga transparent na bahagi ng thumbnail, para hindi mawala ang transparent na larawan sa background ng folder. Para lang sa mga Explorer thumbnail; may sariling switch ang mga preview window. Ang pagbabago nito ay nagbubura sa thumbnail cache."
tip_folder_prebuild = "Maglalagay ng entry na \"Gumawa ng mga thumbnail dito\" sa right-click menu ng mga folder at drive. Dadaanan nito ang folder at gagawin nang maaga ang mga thumbnail, para naroon na agad ang mga larawan sa unang pagbukas mo rito. Kapaki-pakinabang pagkatapos i-clear ang thumbnail cache o mag-copy ng malaking library."
