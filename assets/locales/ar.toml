tip_badge_icon = "يرسم الشارة كعلامة ملف صغيرة ملوّنة - لون واحد لكل نوع من الملفات (الصور، RAW الكاميرا، الكتب الإلكترونية، المستندات، الصوت، الفيديو، الأرشيفات) - بدلاً من نص عادي. أسهل للتمييز بنظرة واحدة. أزل التحديد للحصول على شريحة النص العادي."
tip_corner_mark = "لا يمكن أن يشغل ركن المصغّرة السفلي الأيمن سوى شيء واحد. “أيقونة نوع الملف من Windows” تترك الأمر لـ Explorer، الذي يرسم هناك أيقونة البرنامج المرتبط بالملف (صفحة فارغة إذا أُزيل ذلك البرنامج). “شارة صيغة من SageThumbs” تضع صيغة الملف (PSD, JXL, AVIF…) هناك بدلاً من ذلك، لتتمكن من تمييز الصيغ بنظرة واحدة، وتمنع Explorer من الرسم فوقها. “لا شيء” تترك الصورة خالية من أي علامة. تغيير هذا الخيار يمسح ذاكرة التخزين المؤقت للمصغّرات."
tip_thumb_checker = "يرسم نقشة رقعة شطرنج فاتحة خلف الأجزاء الشفافة من المصغّرة، حتى لا تختفي الصورة الشفافة في خلفية المجلد. تنطبق فقط على مصغّرات Explorer؛ لنوافذ المعاينة مفتاحها الخاص. تغيير هذا الخيار يمسح ذاكرة التخزين المؤقت للمصغّرات."
tip_folder_prebuild = "يضيف عنصر \"إنشاء المصغّرات هنا\" إلى قائمة النقر بالزر الأيمن للمجلدات والأقراص. يمر على المجلد وينشئ المصغّرات مسبقًا، حتى تكون الصور جاهزة من أول مرة تفتحه فيها. مفيد بعد مسح ذاكرة تخزين المصغّرات المؤقتة أو نسخ مكتبة كبيرة إليه."
