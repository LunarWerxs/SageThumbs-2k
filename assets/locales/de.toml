tip_badge_icon = "Zeichnet das Badge als kleine farbige Dateimarkierung - eine Farbe je Dateiart (Bilder, Kamera-RAW, E-Books, Dokumente, Audio, Video, Archive) - statt als reinen Text. Auf einen Blick leichter zu erkennen. Häkchen entfernen für den Text-Chip."
tip_thumb_checker = "Zeichnet ein helles Schachbrettmuster hinter die durchsichtigen Bereiche einer Miniaturansicht, damit ein transparentes Bild nicht im Ordnerhintergrund verschwindet. Gilt nur für Miniaturansichten im Explorer; die Vorschaufenster haben einen eigenen Schalter. Eine Änderung leert den Miniaturansichten-Cache."
tip_video_cover_art = "Wenn ein Video ein darin gespeichertes Poster-Bild (Cover) hat, wird dieses anstelle eines Einzelbilds aus dem Video gezeigt. Am besten für eine Sammlung von Filmen, bei privaten Videos und Bildschirmaufnahmen ausschalten, wo ein echtes Einzelbild mehr verrät. Das Cover wird ohnehin verwendet, wenn kein Einzelbild dekodiert werden kann, unabhängig von dieser Einstellung. Eine Änderung leert den Miniaturansichten-Cache."
tip_hide_type_overlay = "Windows prägt das Symbol des zugehörigen Programms in die Ecke einer Miniaturansicht, über dem Format-Badge - und wenn dieses Programm deinstalliert wurde, zeichnet es stattdessen eine leere Seite. Diese Option bittet Windows, es für die von SageThumbs verarbeiteten Dateitypen nicht zu zeichnen. Umkehrbar: Häkchen entfernen stellt es wieder her."
