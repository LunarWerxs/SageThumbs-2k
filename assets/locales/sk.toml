tip_corner_mark = "V pravom dolnom rohu miniatúry sa zmestí len jedna vec. “Ikona typu súboru podľa Windowsu” ju prenecháva Exploreru, ktorý tam vykreslí ikonu priradeného programu (prázdnu stránku, ak bol tento program odinštalovaný). “Odznak formátu SageThumbs” tam namiesto toho zobrazí formát súboru (PSD, JXL, AVIF…), takže formáty rozoznáte na prvý pohľad, a zabráni Exploreru prekresliť ho. “Nič” necháva obrázok bez akejkoľvek značky. Zmena tohto nastavenia vymaže vyrovnávaciu pamäť miniatúr."
tip_thumb_checker = "Vykreslí jemnú šachovnicu za priehľadnými časťami miniatúry, aby priehľadný obrázok nezmizol v pozadí priečinka. Platí iba pre miniatúry v Prieskumníkovi; okná náhľadu majú vlastný prepínač. Zmena tejto voľby vymaže vyrovnávaciu pamäť miniatúr."
tip_folder_prebuild = "Pridá položku \"Vytvoriť miniatúry tu\" do ponuky pravého kliknutia pre priečinky a jednotky. Prejde priečinkom a miniatúry vytvorí vopred, takže obrázky sú pripravené hneď pri prvom otvorení. Užitočné po vyprázdnení vyrovnávacej pamäte miniatúr alebo skopírovaní veľkej knižnice."
