tip_folder_prebuild = "گزینه‌ای به نام «ساخت بندانگشتی‌ها در اینجا» به منوی راست‌کلیک پوشه‌ها و درایوها اضافه می‌کند. این گزینه پوشه را پیمایش کرده و بندانگشتی‌ها را از پیش می‌سازد، تا در اولین بار که پوشه را باز می‌کنید تصاویر از قبل آماده باشند. پس از پاک کردن حافظهٔ نهان بندانگشتی‌ها یا کپی کردن یک کتابخانهٔ بزرگ مفید است."
