tip_video_cover_art = "وقتی ویدیویی یک تصویر پوستر ذخیره‌شده در خودش داشته باشد، به‌جای یک فریم از ویدیو همان را نشان بده. برای کتابخانهٔ فیلم بهترین گزینه است؛ برای ویدیوهای خانگی و ضبط‌های صفحه‌نمایش آن را خاموش بگذارید، چون در آنجا یک فریم واقعی اطلاعات بیشتری می‌دهد. در هر صورت وقتی هیچ فریمی قابل کدگشایی نباشد، از پوستر استفاده می‌شود، فارغ از اینکه این گزینه چه مقداری داشته باشد. تغییر این گزینه حافظهٔ نهان بندانگشتی‌ها را پاک می‌کند."
tip_hide_type_overlay = "ویندوز آیکون برنامهٔ مرتبط را در گوشهٔ بندانگشتی، روی نشان قالب، می‌زند — و وقتی آن برنامه حذف نصب شده باشد، به‌جای آن یک صفحهٔ خالی نشان می‌دهد. این گزینه از ویندوز می‌خواهد این کار را برای نوع فایل‌هایی که SageThumbs مدیریت می‌کند انجام ندهد. برگشت‌پذیر است: با غیرفعال کردن آن، به حالت قبل برمی‌گردد."
