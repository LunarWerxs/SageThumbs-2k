tip_badge_icon = "نشان را به‌صورت یک علامت کوچک و رنگی فایل می‌کشد — یک رنگ برای هر نوع فایل (تصاویر، RAW دوربین، کتاب‌های الکترونیکی، اسناد، صدا، ویدیو، آرشیوها) — به‌جای متن ساده. تشخیص آن در یک نگاه آسان‌تر است. برای دریافت برچسب متنی ساده، این گزینه را غیرفعال کنید."
