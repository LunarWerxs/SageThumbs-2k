# cargo-deny configuration for SageThumbs 2K.
#
# Run locally with:
#     cargo deny check
#
# CI runs this on the DEFAULT feature set via the `deny` job in
# .github/workflows/ci.yml. SageThumbs 2K's OWN code is PolyForm-Noncommercial-licensed
# (see LICENSE.md — non-permissive/source-available, so the root crate is `publish = false`
# and skipped via [licenses].private below); this file proves every DEPENDENCY is permissive.
#
# NOTE — the entire graph is now 100% permissive. RAR/CBR support moved from the
# proprietary UnRAR C++ (`unrar`/`unrar_sys`, behind an old `rar` feature) to the
# PURE-RUST `rars` crate (MIT OR Apache-2.0, `#![forbid(unsafe_code)]`) on
# 2026-06-15, so there is no longer any non-OSI / proprietary code or license
# exception anywhere — `cargo deny check` passes on the default build with nothing
# to allowlist.

# ----------------------------------------------------------------------------
[graph]
# Match the shipped targets. Most deps are pure-Rust and target-agnostic, but
# pinning the targets keeps the resolved graph (and the advisory/license scan)
# deterministic and avoids flagging crates only reachable on platforms we never
# build for.
targets = [
    { triple = "x86_64-pc-windows-msvc" },
    { triple = "aarch64-pc-windows-msvc" },
]
# Evaluate optional deps too, so the scan stays honest about what *could* be
# compiled in.
all-features = false
# Every feature `scripts/build-release.ps1` actually turns on for a shipped EXE, named
# explicitly so the license/advisory/source checks keep seeing the crates we ship even
# if the default set ever changes. `flash-video` and `vp9-video` are in the core
# package's DEFAULT set already (so were implicitly scanned regardless), but
# `html-preview` and `webp-lossy` are NOT default — they're enabled only by the release
# EXE build — so without listing them here `webview2-com` and `libwebp-sys` were never
# in cargo-deny's scanned graph at all despite shipping in every release. (A036)
features = ["flash-video", "vp9-video", "html-preview", "webp-lossy"]

# ----------------------------------------------------------------------------
[advisories]
# Scan the committed Cargo.lock against the RustSec advisory DB. Anything with a
# known vulnerability or an unmaintained/yanked status fails the build.
db-urls = ["https://github.com/rustsec/advisory-db"]
# Every `ignore` entry carries a dated comment saying why it cannot simply be fixed, and
# what would let it be removed — never blanket-ignore, and never an undated one.
ignore = [
    # paste 1.0.15 is UNMAINTAINED (RUSTSEC-2024-0436) — not a vulnerability, just no
    # longer updated. A tiny, stable proc-macro pulled transitively by `lofty` (the
    # audio-tag reader); no maintained drop-in exists and it compiles fine. Remove this
    # when lofty stops depending on it, or escalate if a real vuln is ever filed. (2026-06-14)
    "RUSTSEC-2024-0436",
    # arrayref 0.3.9 was YANKED from crates.io on/around 2026-08-20. Not a vulnerability -
    # `cargo deny check advisories` is clean and no RUSTSEC entry exists; a yank is a
    # publisher action, and this one broke every push in the repo overnight without a line of
    # our code changing.
    #
    # We do not depend on it directly. It arrives through resvg -> tiny-skia (and
    # tiny-skia-path via usvg), both of which pin it, so the fix has to come from upstream.
    #
    # AND THE OBVIOUS FIX IS WORSE, WHICH IS THE REASON THIS ENTRY EXISTS RATHER THAN A BUMP.
    # `cargo update -p arrayref --precise 0.3.10` moves two lines and then re-resolves the
    # whole graph: +477 lockfile lines, pulling ring, untrusted, rustls-webpki and two
    # webpki-roots into the DEFAULT graph, none of which are in the lock today and none of
    # which we build. That trips the licence policy (ISC and CDLA-Permissive-2.0 are not on
    # the allowlist), so trading a yank warning for a TLS stack and a licence failure is a
    # bad deal on a shell extension that does no networking.
    #
    # REMOVE THIS when resvg/tiny-skia release against a non-yanked arrayref, and re-run
    # `cargo deny check` to confirm the graph did not grow. Re-check at the next dependency
    # sweep; escalate immediately if an actual advisory is ever filed against 0.3.9. (2026-08-20)
    "arrayref@0.3.9",
]
# Yanked crates in the lockfile should fail (the lock is committed, so this
# catches a bad pin landing in the repo).
yanked = "deny"

# ----------------------------------------------------------------------------
[licenses]
# Allowlist covering the actual DEFAULT-feature graph (derived from Cargo.lock):
#   MIT / Apache-2.0 ........ the overwhelming majority of the tree
#   BSD-2-Clause ............ arrayref
#   BSD-3-Clause ............ tiny-skia, tiny-skia-path
#   Zlib .................... foldhash
#   Unicode-3.0 ............. unicode-ident (AND component of its SPDX expr)
# (No MPL-2.0 or ISC crate is present in the default graph, so neither is
#  allowed here — keep this list tight to what actually resolves.)
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "Zlib",
    "Unicode-3.0",
]
# Crates whose SPDX expression is an AND of several IDs (e.g. unicode-ident is
# "(MIT OR Apache-2.0) AND Unicode-3.0") must have EVERY ANDed term allowed.
# Require a high confidence match when cargo-deny harvests the license text.
confidence-threshold = 0.93

# The root crate (sagethumbs2k) ships under PolyForm Noncommercial — a non-permissive,
# source-available license — and is `publish = false`. Skip workspace members so this
# scan checks only DEPENDENCY licenses, which remain 100% permissive (MIT/Apache/BSD/…).
private = { ignore = true }

# (No license exceptions needed: the whole graph is permissive now that RAR/CBR
# uses the pure-Rust `rars` crate instead of the proprietary UnRAR C++.)

# The three nihav crates (the git-pinned VP6 decoder, see [sources]) declare NO `license`
# field in their Cargo.tomls; the repository's root COPYING is the literal MIT license
# text, which covers the whole workspace. Clarify rather than allowlist-by-exception so
# cargo-deny still verifies everything else about them.
[[licenses.clarify]]
crate = "nihav_core"
expression = "MIT"
license-files = []

[[licenses.clarify]]
crate = "nihav_codec_support"
expression = "MIT"
license-files = []

[[licenses.clarify]]
crate = "nihav_duck"
expression = "MIT"
license-files = []

# ----------------------------------------------------------------------------
[bans]
# A duplicated crate version is a smell (bigger binary, slower build) but not a
# hard failure — the resvg / image / windows stacks legitimately pull a couple
# of overlapping minor versions. Surface them without breaking CI.
multiple-versions = "warn"
# Wildcard ("*") version requirements make the lockfile non-reproducible; flag
# them.
wildcards = "warn"
# We don't currently forbid any specific crate or force a single source.
deny = []
# djvu-rs 0.26's required `std` feature still pins png 0.17 (and therefore
# bitflags 1), while the app/image stack uses png 0.18 + bitflags 2. The same
# pin remains in djvu-rs 0.27, so unifying these requires an upstream feature/
# dependency change or a local fork. Keep the exceptions exact: cargo-deny will
# report them as unmatched when upstream moves, while every new duplicate still
# surfaces normally.
skip = [
    { crate = "png@0.17.16", reason = "required by djvu-rs std; upstream 0.27 still pins png 0.17" },
    { crate = "bitflags@1.3.2", reason = "transitive through djvu-rs's pinned png 0.17" },
    { crate = "syn@3.0.3", reason = "thiserror 2.0.19 has migrated to syn 3 while the Windows, ZIP, and derive stacks still require syn 2" },
    # wide/safe_arch (A113, 2026-08-15): djvu-rs pulls wide 0.7.33 -> safe_arch 0.7.4; the FLV
    # VP6 decode stack's h263-rs-yuv pulls wide 0.8.3 -> safe_arch 0.9.3. Documented in
    # docs/TODO.md as "a NOTE, not a blocker" but that note wasn't in deny.toml itself, so a
    # genuinely NEW duplicate wouldn't have stood out against these two the way the skip list
    # is meant to make new ones do.
    { crate = "wide@0.7.33", reason = "required by djvu-rs; h263-rs-yuv (flash-video) pulls wide 0.8.3" },
    { crate = "wide@0.8.3", reason = "required by h263-rs-yuv (flash-video); djvu-rs pulls wide 0.7.33" },
    { crate = "safe_arch@0.7.4", reason = "transitive through djvu-rs's pinned wide 0.7.33" },
    { crate = "safe_arch@0.9.3", reason = "transitive through h263-rs-yuv's pinned wide 0.8.3" },
]

# ----------------------------------------------------------------------------
[sources]
# Registry dependencies must come from crates.io, and git dependencies are not
# expected. `exr` 1.74.2 is intentionally overridden by the reviewed local path
# in `[patch.crates-io]`; cargo-deny treats workspace/path sources separately, so
# these rules still catch an unexpected alternate registry or git dependency.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# The ONLY allowed git sources: the pure-Rust FLV Flash codecs (issue #26). Neither is
# published on crates.io, so Ruffle's repos — where these crates are maintained and
# shipped as THE Flash codecs — are the canonical source. Both are pinned by rev in
# Cargo.toml (never a branch), reachable only via the EXE-only `flash-video` feature,
# and permissively licensed (nihav: MIT per the repo's COPYING, clarified below;
# h263-rs*: MIT OR Apache-2.0). Anything else from git stays denied.
allow-git = [
    "https://github.com/ruffle-rs/nihav-vp6",
    "https://github.com/ruffle-rs/h263-rs",
]
# Neither crate has a crates.io release, so there's no semver and this list is a real
# supply-chain dependency on Ruffle's repos staying reachable, accepted, not ignored:
# the pin is by REV (never a branch, see Cargo.toml). If repo availability ever becomes
# a concern, vendor under crates/vendor/ with a SAGETHUMBS-PATCH.md (the exr precedent).
